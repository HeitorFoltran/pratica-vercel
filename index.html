<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Deploy na Vercel</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #2a2a3a;
      --accent: #7c6bff;
      --accent2: #ff6b9d;
      --text: #e8e8f0;
      --muted: #6b6b80;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.4;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(48px); }
    }

    /* Glow blobs */
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,107,255,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 56px 64px;
      max-width: 560px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 0 1px rgba(124,107,255,0.1), 0 32px 80px rgba(0,0,0,0.6);
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(124,107,255,0.12);
      border: 1px solid rgba(124,107,255,0.3);
      border-radius: 99px;
      padding: 6px 16px;
      margin-bottom: 32px;
      animation: fadeUp 0.7s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 16px;
      animation: fadeUp 0.7s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .name {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 40px;
      animation: fadeUp 0.7s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .name strong {
      color: var(--text);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin-bottom: 40px;
      animation: fadeUp 0.7s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      animation: fadeUp 0.7s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
      50%       { opacity: 0.8; box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    }

    .status {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      animation: fadeUp 0.7s 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">✦ Deploy realizado com sucesso</div>

    <h1>Olá, <span>Vercel!</span></h1>

    <p class="name">por <strong>Seu Nome Aqui</strong></p>

    <div class="divider"></div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value">~30s</span>
        <span class="stat-label">Tempo de deploy</span>
      </div>
      <div class="stat">
        <span class="stat-value">0</span>
        <span class="stat-label">Configs necessárias</span>
      </div>
      <div class="stat">
        <span class="stat-value">∞</span>
        <span class="stat-label">Possibilidades</span>
      </div>
    </div>

    <p class="status"><span class="dot"></span>online · edge network · https ativo</p>
  </div>
</body>
</html>
